name: Update profile card

on:
  schedule:
    - cron: "0 4 * * *" # daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerate profile card
        run: npx tsx profile/update.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACCESS_TOKEN: ${{ secrets.ACCESS_TOKEN }}

      - name: Show diff
        run: git diff --stat -- profile/dark_mode.svg profile/light_mode.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/dark_mode.svg profile/light_mode.svg
          if git diff --staged --quiet; then
            echo "No changes to profile card, nothing to commit."
          else
            git commit -m "Update profile card stats"
            git pull --rebase origin master
            git push
            echo "Pushed updated profile card ($(git rev-parse --short HEAD))."
          fi
